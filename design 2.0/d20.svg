<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Icosahedron d20">
  <defs>
    <radialGradient id="d20glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#f0c989" stop-opacity="0.45"></stop>
      <stop offset="55%" stop-color="#d4a574" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="d20lit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b6332" stop-opacity="0.7"></stop>
      <stop offset="100%" stop-color="#3a2a18" stop-opacity="0.55"></stop>
    </linearGradient>
    <linearGradient id="d20mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3f20" stop-opacity="0.65"></stop>
      <stop offset="100%" stop-color="#241810" stop-opacity="0.6"></stop>
    </linearGradient>
    <linearGradient id="d20shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c130a" stop-opacity="0.85"></stop>
      <stop offset="100%" stop-color="#0a0604" stop-opacity="0.95"></stop>
    </linearGradient>
    <radialGradient id="d20core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0c989" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#8b6332" stop-opacity="0.22"></stop>
    </radialGradient>
    <clipPath id="d20clip">
      <polygon points="120,20 207,70 207,170 120,220 33,170 33,70"></polygon>
