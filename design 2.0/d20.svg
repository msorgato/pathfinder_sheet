  </defs>

  
  <circle cx="120" cy="120" r="115" fill="url(#d20glow)"></circle>

  
  <polygon points="120,20 207,70 207,170 120,220 33,170 33,70" fill="#0a0604"></polygon>

  
  <g clip-path="url(#d20clip)">
    
    <polygon points="120,58 120,20 33,70" fill="url(#d20lit)"></polygon>     
    <polygon points="120,58 207,70 120,20" fill="url(#d20mid)"></polygon>     
    <polygon points="67,151 33,70 33,170" fill="url(#d20shade)"></polygon>   
    <polygon points="173,151 207,170 207,70" fill="url(#d20mid)" opacity="0.85"></polygon> 
    <polygon points="67,151 33,170 120,220" fill="url(#d20shade)"></polygon>   
    <polygon points="173,151 120,220 207,170" fill="url(#d20shade)" opacity="0.9"></polygon> 
    
    <polygon points="67,151 120,58 33,70" fill="url(#d20mid)"></polygon>    
    <polygon points="173,151 207,70 120,58" fill="url(#d20mid)" opacity="0.78"></polygon> 
    <polygon points="67,151 120,220 173,151" fill="url(#d20shade)" opacity="0.75"></polygon> 
    
    <polygon points="120,58 173,151 67,151" fill="url(#d20core)"></polygon>   
  </g>

  
  <g fill="none" stroke="#d4a574" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="120,20 207,70 207,170 120,220 33,170 33,70" stroke-width="2.4"></polygon>
    <polygon points="120,58 173,151 67,151" stroke="#f0c989" stroke-width="2.1"></polygon>
    
    <line x1="67" y1="151" x2="120" y2="220"></line>
    <line x1="67" y1="151" x2="33" y2="70"></line>
    <line x1="67" y1="151" x2="33" y2="170"></line>
    
    <line x1="120" y1="58" x2="120" y2="20"></line>
    <line x1="120" y1="58" x2="33" y2="70"></line>
    <line x1="120" y1="58" x2="207" y2="70"></line>
    
    <line x1="173" y1="151" x2="120" y2="220"></line>
    <line x1="173" y1="151" x2="207" y2="170"></line>
    <line x1="173" y1="151" x2="207" y2="70"></line>
  </g>

  
  <g fill="#f0c989">
    <circle cx="120" cy="20" r="2.6"></circle>
    <circle cx="207" cy="70" r="2.6"></circle>
    <circle cx="207" cy="170" r="2.6"></circle>
    <circle cx="120" cy="220" r="2.6"></circle>
    <circle cx="33" cy="170" r="2.6"></circle>
    <circle cx="33" cy="70" r="2.6"></circle>
    <circle cx="120" cy="58" r="2.1"></circle>
    <circle cx="67" cy="151" r="2.1"></circle>
    <circle cx="173" cy="151" r="2.1"></circle>
